<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">RucBase project card image</title>
  <desc id="desc">A typographic placeholder image for the RucBase teaching database project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f0ea"/>
      <stop offset="100%" stop-color="#e5ddd0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b2a86"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="62" y="62" width="836" height="416" rx="30" fill="#fbfaf7" stroke="#d2c4b2" stroke-width="3"/>
  <rect x="118" y="124" width="724" height="96" rx="22" fill="url(#accent)"/>
  <text x="480" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">RucBase</text>
  <text x="480" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2d3748">Database kernel platform for teaching and labs</text>
  <text x="480" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4a5568">Storage · Indexing · Query Execution · Concurrency Control</text>
  <text x="480" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6b7280">Used for hands-on database systems education</text>
</svg>
