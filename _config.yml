rss_icon: false

contact_note: >
  Feel free to reach out by email or GitHub.

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name:
blog_description:
permalink:

pagination:
  enabled: false

disqus_shortname: al-folio

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
highlight_theme: github
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - README.md
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - suyzhong.github.io
keep_files:
  - .git

plugins:
  - jekyll-feed
  - jekyll-github-metadata
  - jekyll-sitemap
  - jemoji

defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

github: [metadata]

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_panelbear_analytics: false
enable_mansory: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: true

